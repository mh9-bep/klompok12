<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MASUK</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="assets/icons/EduLearn-Photoroom.png">
</head>
<body>
    <main class="container">
        <div class="nav">
            <img src="assets/images/EduLearn.png" alt="logi" class="img">
        </div>
        <div class="div-form">
            <form action="pages/halaman_utama.html">
                <b>Username</b><br>
                <input type="text" placeholder="Masukan Username" class="form-username"><br><br>
                <b>Tanggal Lahir</b><br>
                <input type="date" class="form-date"><br><br>
                <b>Jenis Kelamin</b><br>
                <input type="radio" name="jk" id="laki-laki" >
                <b>laki-laki</b><br>
                <input type="radio" name="jk" id="perempuan">
                <b>perempuan</b><br><br>
                <b>Email/nomor</b><br>
                <input type="email" placeholder="masukan Email/nomor" class="form-email"> <br><br>
                <input type="submit" value="Masuk" class="form-sumbit">
            </form>
        </div>
    </main>
</body>
</html>
